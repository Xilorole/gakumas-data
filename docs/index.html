<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gakumas-data viewer</title>
  <!-- CSS は後回し。構造と class だけ用意し、後から着せ替えられるようにする。 -->
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">gakumas-data</h1>
    <p class="site-desc">学マス コミュ文字起こしビューア</p>
  </header>
  <main class="layout">
    <nav class="sidebar" aria-label="コミュ一覧">
      <div id="index" class="index">読み込み中…</div>
    </nav>
    <section class="viewer" aria-live="polite">
      <div id="transcript" class="transcript">
        <p class="placeholder">左の一覧から話を選んで、ね。</p>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
