name: Deploy viewer to GitHub Pages

# main への push でビューアをビルドし、データ JSON を同梱して gh-pages ブランチに公開する。
# PR プレビュー（pr-preview.yml）が同じ gh-pages ブランチの pr-preview/ 以下を使うため、
# ブランチ配信方式（Settings → Pages → Source: Deploy from a branch, gh-pages, /）を使う。
# keep_files: true で pr-preview/ ディレクトリを本番デプロイのたびに消さないようにしている。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install deps
        working-directory: viewer
        run: npm ci

      - name: Build SPA
        working-directory: viewer
        run: npm run build

      - name: Bundle data into dist
        shell: bash
        run: |
          set -euo pipefail
          cp index.json viewer/dist/
          # ルート直下のデータディレクトリだけを同梱（ツール系は除外）
          for d in */ ; do
            case "$d" in
              viewer/|scripts/|node_modules/|.git/|.github/) continue ;;
            esac
            cp -R "$d" viewer/dist/
          done
          touch viewer/dist/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: viewer/dist
          keep_files: true
